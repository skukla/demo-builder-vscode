name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # postinstall runs `npm run compile` (esbuild); tsc/eslint/jest don't need
      # the build output (jest transpiles source via swc), so skip it for speed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Test files are excluded from tsconfig.json and @swc/jest strips types,
      # so without this step nothing typechecks the test tree (fixtures could
      # invent shapes and the suite agreed — see
      # .rptc/complete/2026-08-13-test-files-are-not-typechecked.md).
      - name: Typecheck tests
        run: npm run typecheck:tests

      # tsc's include globs keep one file per basename (.ts beats .tsx), so a
      # file pair like index.ts + index.tsx leaves the .tsx silently unchecked
      # — how the dashboard webview entry went untypechecked for months and hid
      # a dead wire read (fixed 20f45f8f). This asserts both configs' file sets
      # cover everything on disk.
      - name: Typecheck blind spots
        run: npm run validate:tsc-blindspots

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
