<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark}
body{font-family:var(--font-sans,system-ui,sans-serif);margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted-foreground,#aaa)}
.chip{border:1px solid var(--border,#444);border-radius:14px;padding:4px 11px;cursor:pointer;color:var(--foreground,#eee);background:transparent;font:inherit}
.chip.on{background:var(--primary,#1473e6);border-color:var(--primary,#1473e6);color:#fff}
.reset{margin-left:auto}
.stage{background:#111;border-radius:8px;padding:28px 18px;display:flex;justify-content:center;min-height:560px;align-items:flex-start}
.dlg{background:#1e1e1e;color:#eee;border-radius:8px;padding:22px 26px;font-size:13px;width:100%;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:max-width .25s}
.S{max-width:420px}.M{max-width:600px}
.title{font-size:18px;font-weight:700;padding-bottom:10px;border-bottom:2px solid #3a3a3a;display:flex;gap:8px;align-items:center}
.warn,.ok{width:16px;height:16px;border-radius:50%;color:#000;font-weight:900;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.warn{background:#e68619}.ok{background:#2d9d78}
.lead{margin:14px 0 10px;color:#ddd;line-height:1.45}
.btns{display:flex;gap:10px;margin-top:18px;align-items:center}.btns .sp{flex:1}
.b{border:2px solid #777;border-radius:16px;padding:5px 14px;font-weight:700;white-space:nowrap;cursor:pointer;background:none;color:#eee;font:inherit;font-weight:700}
.b.p{background:#1473e6;border-color:#1473e6}
.b:disabled{opacity:.4;cursor:default}
.wait{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 0 14px}
.sp1{width:22px;height:22px;border-radius:50%;border:3px solid #378ef0;border-top-color:transparent;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.wl{font-weight:700}.wd{color:#bbb}.wt{color:#999;font-size:12px}
.facts{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;margin:6px 0 12px}.fl{color:#999}
.rad{display:flex;gap:10px;padding:8px 0;align-items:center;border-bottom:1px solid #2c2c2c;cursor:pointer}
.r{width:13px;height:13px;border:1.5px solid #bbb;border-radius:50%;flex:none;box-sizing:border-box}
.r.on{border:4px solid #1473e6}
.muted{color:#999;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.lbl{color:#aaa;font-size:12px;margin:12px 0 6px}
.pick{border:1px solid #555;border-radius:4px;padding:6px 8px;color:#ccc;display:flex;justify-content:space-between}
.cb{display:flex;gap:9px;padding:4px 0;align-items:center}
.box{width:13px;height:13px;border:1.5px solid #bbb;border-radius:2px;flex:none;box-sizing:border-box}
.box.on{background:#1473e6;border-color:#1473e6}
.types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #2c2c2c}
.step:last-of-type{border-bottom:none}
.ic{width:14px;height:14px;border-radius:50%;flex:none;margin-top:2px;box-sizing:border-box}
.ic.done{background:#2d9d78}.ic.w{border:2px solid #666}.ic.spin{border:2px solid #378ef0;border-top-color:transparent;animation:r 1s linear infinite}
.sl{font-weight:700}.line{color:#aaa;font-size:12px;margin-top:2px}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-top:8px}
.t{display:flex;gap:8px;padding:3px 0;font-size:12px;align-items:center}
.t .ic{width:10px;height:10px;margin-top:0}
.tl{color:#ddd}.tv{color:#999;margin-left:4px}
.clock{color:#aaa;font-size:12px;margin-top:12px}
.hint{font-size:12px;color:var(--muted-foreground,#999);margin-top:10px;line-height:1.45}
</style></head><body>
<div class="bar">Case:
<button class="chip" data-case="changes">Restore, with changes</button>
<button class="chip" data-case="clean">Restore, nothing changed</button>
<button class="chip" data-case="first">First import</button>
<button class="chip reset" id="reset">Start Over</button></div>
<div class="stage"><div id="dlg" class="dlg M"></div></div>
<div class="hint" id="hint"></div>
<script>
const TYPES=['Attribute Sets','Product Attributes','Attribute Assign to Set','Categories','Customer Groups','Products','Gift Cards','Source Items','Customers','Cart Rules','Coupons'];
const S={case:'changes',view:'history',chosen:null,save:true,t0:0,always:false};
const $=s=>document.querySelector(s);
function setCase(c){S.case=c;start();document.querySelectorAll('[data-case]').forEach(b=>b.classList.toggle('on',b.dataset.case===c));}
function start(){S.view=S.case==='first'?'form':'history';S.chosen=null;S.save=true;clearInterval(S.tick);render();}
function go(v){S.view=v;render();}
function startRun(save){S.save=save;S.view='run';S.t0=Date.now();clearInterval(S.tick);S.tick=setInterval(render,120);render();}
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>setCase(b.dataset.case));
$('#reset').onclick=start;
function btns(left,right){return `<div class="btns">${left||''}<span class="sp"></span>${right||''}</div>`}
function B(label,act,primary,dis){return `<button class="b ${primary?'p':''}" ${dis?'disabled':''} onclick="${act}">${label}</button>`}
const version=()=>S.case==='first'?'':'Nov 9, 1:56 PM';
function historyView(){
 const rows=[['Nov 9, 3:12 PM',''],['Nov 9, 1:56 PM',''],['Nov 9, 9:15 AM','In Use'],['Nov 8, 4:30 PM','']];
 return `<div class="title">Version History</div><div class="lead">This demo's data goes back to the version you choose. No version is deleted.</div>`+
 rows.map(([d,u])=>`<div class="rad" onclick="S.chosen='${d}';render()"><span class="r ${S.chosen===d?'on':''}"></span><div>${d}</div><span class="muted" style="margin-left:auto">${u}</span></div>`).join('')+
 btns('',B('Cancel','start()')+B('Restore Version',"go('form')",true,!S.chosen||S.chosen==='Nov 9, 9:15 AM'));
}
function form(){
 const lead=S.case==='first'?'':`<div class="lead">Replaces this demo's data with the version from ${S.chosen||version()}.</div>`;
 const all=true;
 return `<div class="title">Import My Luma</div>${lead}<div class="grid2"><div><div class="lbl">Website</div><div class="pick">Justrite Test <span>&#9662;</span></div></div><div><div class="lbl">Store View</div><div class="pick">Justrite Test Store US <span>&#9662;</span></div></div></div><div class="lbl">Data</div><div class="types">`+
 TYPES.map(t=>`<div class="cb"><span class="box ${all?'on':''}"></span>${t}</div>`).join('')+`</div>`+
 btns(B('Remove Data','')+B('Dry Run',''),B('Cancel','start()')+B('Import',S.case==='first'?"startRun(false)":"go('checking');setTimeout(()=>{if(S.view==='checking'){S.case==='changes'?go('question'):startRun(false)}},2600)",true));
}
function checking(){return `<div class="title">Import My Luma</div><div class="wait"><span class="sp1"></span><div class="wl">Checking for your changes</div><div class="wd">Since this demo's last save</div><div class="wt">Usually about a minute</div></div>`+btns('',B('Cancel',"go('form')"));}
function question(){
 return `<div class="title"><span class="warn">!</span>Save Your Changes First?</div><div class="lead">You changed these since this demo's last save. Importing replaces them.</div>
 <div class="facts"><div class="fl">Products</div><div>24-mb01, 24-mb02, 24-ug01 and 2 more</div><div class="fl">Categories</div><div>Bags</div><div class="fl">Customers</div><div>roni_cost@example.com</div></div>
 <div class="cb" onclick="S.always=!S.always;render()" style="cursor:pointer"><span class="box ${S.always?'on':''}"></span>Always Save Without Asking</div>`+
 btns(B('Import Without Saving','startRun(false)'),B('Cancel',"go('form')")+B('Save and Import','startRun(true)',true));
}
// The run's clock: each step's span, in mock seconds.
function plan(){
 const p=[];let t=0;
 if(S.save){p.push(['save',t,t+=3]);}
 if(S.case!=='first'){p.push(['remove',t,t+=3.5]);}
 p.push(['install',t,t+=7.5]);p.push(['check',t,t+=2.5]);return p;
}
function stateOf(span,el){if(!span)return null;const[,a,b]=span;return el<a?'w':el<b?'spin':'done';}
function run(){
 const el=(Date.now()-S.t0)/1000,p=plan(),get=k=>p.find(x=>x[0]===k),end=p[p.length-1][2];
 if(el>=end){clearInterval(S.tick);}
 const fin=el>=end;
 const at=k=>{const s=get(k);return s?Math.min(1,Math.max(0,(el-s[1])/(s[2]-s[1]))):0};
 let h=`<div class="title">${fin?'<span class="ok">&#10003;</span>My Luma Imported':'Import My Luma'}</div>`;
 if(fin){h+=`<div class="lead">${S.case==='first'?'My Luma is in Justrite Test Store US.':`This demo now uses My Luma from ${S.chosen||version()}.`}${S.save?' Your changes are saved as Nov 9, 3:39 PM.':''} Products can take up to 20 minutes to appear in storefront search.</div>`;}
 const row=(k,label,lineW,lineRun,lineDone,extra='')=>{const st=stateOf(get(k),el);if(!st)return'';const line=st==='w'?lineW:st==='spin'?lineRun(at(k)):lineDone;return `<div class="step"><span class="ic ${st}"></span><div style="flex:1"><div class="sl">${label}</div><div class="line">${line}</div>${extra}</div></div>`};
 const n=(f,tot)=>Math.round(f*tot).toLocaleString('en-US');
 h+=row('save','Save Your Changes','Waiting',f=>`Saving, ${Math.min(9,1+Math.floor(f*9))} of 9 data types`,'Saved as Nov 9, 3:39 PM');
 h+=row('remove','Remove the Previous Version','Waiting',f=>f<.25?'Reading the new version':`Removing Nov 9, 9:15 AM, ${n((f-.25)/.75,2197)} of 2,197 items`,'Removed Nov 9, 9:15 AM');
 const ip=at('install'),k=Math.floor(ip*TYPES.length);
 const sub=`<div class="sub">`+TYPES.map((t,i)=>{const st=fin||i<k?'done':i===k&&stateOf(get('install'),el)==='spin'?'spin':'w';const v=st==='spin'&&t==='Products'?`<span class="tv">${n((ip*TYPES.length-k),2046)} of 2,046</span>`:'';return `<div class="t"><span class="ic ${st}"></span><span class="tl">${t}</span>${v}</div>`}).join('')+`</div>`;
 h+=row('install',S.case==='first'?'Install My Luma':`Install the Version from ${S.chosen||version()}`,'Waiting',f=>f<.08?'Comparing the store':`${Math.min(TYPES.length,k)} of ${TYPES.length} data types`,'Installed',sub);
 h+=row('check','Verify the Import','Waiting',f=>f<.5?'Recording what went in':'Comparing 2,048 products with the version','All 2,048 match');
 if(!fin)h+=`<div class="clock">${Math.floor(el)} seconds</div>`;
 h+=btns('',fin?B('Close','start()',true):B('Run in Background',''));
 return h;
}
const VIEWS={history:historyView,form,checking,question,run};
const HINTS={history:'Version History, from the datapack\'s More menu. Pick a version that is not In Use.',form:'The import window opens at once on the version chosen. Every data type is ticked for a replace.',checking:'Same title and width as the question, so nothing jumps.',question:'Only when something changed. Import Without Saving stands apart on the left.',run:'One window from here to the end. It never closes on its own.'};
function render(){const d=$('#dlg');d.className='dlg '+(S.view==='history'?'S':'M');d.innerHTML=VIEWS[S.view]();$('#hint').textContent=HINTS[S.view];}
setCase('changes');
</script></body></html>
